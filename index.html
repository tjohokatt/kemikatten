<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Selmas kemikatt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: en smal spelkolumn. Klibbig statusrad överst, sedan katten Molly med pratbubbla och under den ett aktivitetskort. */
:root{
  --bg:#E4F5F1; --dot:#CDEBE5; --surface:#FFFFFF; --surface-2:#F2FAF8; --ink:#2A2342; --ink-soft:#625B7C; --line:#C5E2DC;
  --pink:#EE4F8B; --pink-deep:#C2356C; --pink-soft:#FFE0EB; --on-pink:#FFFFFF;
  --aqua:#159C97; --aqua-soft:#CFF2EE;
  --sun:#F5B921; --sun-deep:#D99A00; --sun-soft:#FFF0C2;
  --lilac:#7E63E0; --lilac-soft:#E8E1FF;
  --good:#168A5B; --good-soft:#D3F4E3; --bad:#D4491F; --bad-soft:#FFE2D6;
  --cat:#FFD6A3; --cat-dark:#F0A257; --cat-belly:#FFF6EA; --cat-pink:#FF97B8; --cat-ink:#2A2342;
  --atom-h:#FFFFFF; --atom-o:#F0638F; --atom-c:#5B5670; --neutron:#CFC8E8;
  --font-display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1A162E; --dot:#231E3D; --surface:#2A2447; --surface-2:#322B54; --ink:#F5F0FF; --ink-soft:#BDB4DA; --line:#433A6E;
  --pink:#FF7DAE; --pink-deep:#C74E80; --pink-soft:#4B2946; --on-pink:#2A0F20;
  --aqua:#56D9D1; --aqua-soft:#1E4850;
  --sun:#FFD15C; --sun-deep:#E0B13A; --sun-soft:#4B4020;
  --lilac:#B49EFF; --lilac-soft:#3A2F68;
  --good:#56D6A0; --good-soft:#1D4739; --bad:#FF8E6B; --bad-soft:#522B22;
  --atom-o:#FF7DAE; --atom-c:#8E88A8; --neutron:#A79FCB;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1A162E; --dot:#231E3D; --surface:#2A2447; --surface-2:#322B54; --ink:#F5F0FF; --ink-soft:#BDB4DA; --line:#433A6E;
  --pink:#FF7DAE; --pink-deep:#C74E80; --pink-soft:#4B2946; --on-pink:#2A0F20;
  --aqua:#56D9D1; --aqua-soft:#1E4850;
  --sun:#FFD15C; --sun-deep:#E0B13A; --sun-soft:#4B4020;
  --lilac:#B49EFF; --lilac-soft:#3A2F68;
  --good:#56D6A0; --good-soft:#1D4739; --bad:#FF8E6B; --bad-soft:#522B22;
  --atom-o:#FF7DAE; --atom-c:#8E88A8; --neutron:#A79FCB;
  color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dot) 2.5px,transparent 3px);background-size:26px 26px;color:var(--ink);font:600 17px/1.5 var(--font-body);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
sub{font-size:.7em;line-height:0}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}

/* statusrad */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:2px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px}
.brand{font:800 21px/1 var(--font-display);margin-right:auto}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 11px;font:800 15px/1.3 var(--font-body);font-variant-numeric:tabular-nums;white-space:nowrap}
button.pill:hover{border-color:var(--pink)}
#homeBtn{margin-right:auto}

.wrap{max-width:760px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

/* katt + pratbubbla */
.cat{position:relative}
.cat svg{display:block;width:100%;height:auto}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px 18px;font-weight:700;min-width:0}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;width:16px;height:16px;margin-top:-8px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.hero{display:grid;grid-template-columns:minmax(104px,190px) minmax(0,1fr);gap:18px;align-items:center}
.hero .bubble{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.hero h1{font-size:clamp(28px,6vw,40px);font-weight:800;color:var(--pink)}
.coach{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:center}
.coach .bubble{min-height:58px;display:flex;align-items:center}
.heart{position:absolute;left:50%;top:20%;font-size:26px;color:var(--pink);pointer-events:none;animation:floatup 1.2s ease-out forwards}

/* knappar */
.btn{background:var(--pink);color:var(--on-pink);border:0;border-radius:999px;padding:10px 24px;font:800 20px/1.2 var(--font-display);box-shadow:0 4px 0 var(--pink-deep);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pink-deep)}
.btn.small{font-size:17px;padding:8px 18px}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* startsidan */
.gift{font-size:15px;color:var(--ink-soft)}
.sec-title{font-size:24px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tile{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center;text-align:left;padding:12px 14px;background:var(--surface);border:2px solid var(--line);border-radius:22px;box-shadow:0 4px 0 var(--line);transition:transform .12s,box-shadow .12s}
.tile:hover{border-color:var(--pink)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile .ico{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px}
.t-pink{background:var(--pink-soft)} .t-aqua{background:var(--aqua-soft)} .t-sun{background:var(--sun-soft)} .t-lilac{background:var(--lilac-soft)}
.tile .txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.tile .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kick{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.tile .tt{font:800 20px/1.15 var(--font-display)}
.tile .sub{font-size:14px;color:var(--ink-soft);line-height:1.3}
.stars{letter-spacing:2px;color:var(--line);font-size:17px;white-space:nowrap}
.stars b{color:var(--sun-deep);font-weight:400}
.diploma{border:3px dashed var(--sun);background:var(--sun-soft);border-radius:24px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.diploma h2{font-size:26px}

/* station */
.st-head{display:flex;flex-direction:column;gap:4px}
.st-head h1{font-size:clamp(26px,5.5vw,34px);font-weight:800}
.dots{display:flex;gap:6px;flex-wrap:wrap;padding-top:4px}
.dots i{width:12px;height:12px;border-radius:999px;background:var(--line);transition:all .2s}
.dots i.done{background:var(--good)} .dots i.now{width:30px;background:var(--pink)}
.stage{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:14px}
.q{font-size:clamp(21px,4.6vw,26px);font-weight:700}
.note{font-size:14px;color:var(--ink-soft);text-align:center}
.art{max-width:300px;margin:0 auto;width:100%}
.art svg{display:block;width:100%;height:auto}
.fb{display:flex;flex-direction:column;gap:12px;align-items:flex-start;background:var(--good-soft);border:2px solid var(--good);border-radius:20px;padding:14px 16px;animation:pop .25s}
.fb.oops{background:var(--sun-soft);border-color:var(--sun)}
.fb p{font-weight:700}

/* flerval */
.opts{display:grid;gap:10px}
.opts.short{grid-template-columns:1fr 1fr}
.opt{text-align:left;padding:13px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);font-weight:700;box-shadow:0 3px 0 var(--line);transition:transform .1s}
.opts.short .opt{text-align:center;font:800 21px/1.2 var(--font-display)}
.opt:hover:not(:disabled){border-color:var(--pink)}
.opt:active:not(:disabled){transform:translateY(2px)}
.opt:disabled{cursor:default;opacity:.55}
.opt.right{background:var(--good-soft);border-color:var(--good);box-shadow:none;opacity:1}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);box-shadow:none;opacity:.8;animation:shake .35s}

/* dra och släpp */
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:50px}
.chip{position:relative;display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;border-radius:14px;background:var(--sun-soft);border:2px solid var(--sun);color:var(--ink);font:800 16px/1.25 var(--font-body);box-shadow:0 3px 0 var(--sun);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;text-align:left}
.chip.sel{outline:3px solid var(--pink);outline-offset:2px;transform:translateY(-3px)}
.chip.dragging{z-index:60;cursor:grabbing;box-shadow:0 10px 18px rgba(0,0,0,.25)}
.chip.locked{background:var(--good-soft);border-color:var(--good);box-shadow:none;cursor:default}
.chip.shake,.mbtn.shake,.oitem.shake{animation:shake .35s}
.pic{position:relative;max-width:440px;width:100%;margin:0 auto}
.pic svg{display:block;width:100%;height:auto}
.pic.scene{border-radius:18px;overflow:hidden;border:2px solid var(--line)}
.pic text{font-family:var(--font-body);font-weight:800}
.slot{position:absolute;transform:translate(-50%,-50%);min-width:98px;min-height:38px;padding:1px;border:2px dashed var(--ink-soft);border-radius:13px;background:var(--surface);display:grid;place-items:center;cursor:pointer}
.slot.w{min-width:124px}
.slot.full{border-color:transparent;background:transparent;cursor:default}
.slot .chip{font-size:14px;padding:6px 7px;width:100%;white-space:nowrap}
.zone.over{border-color:var(--pink);background:var(--pink-soft)}
.has-sel .zone:not(.full){border-color:var(--pink);animation:pulse 1s infinite}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.bucket{border:2px dashed var(--ink-soft);border-radius:18px;padding:10px 12px;min-height:106px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;cursor:pointer}
.b-title{font:800 18px/1.2 var(--font-display)}
.b-desc{font-size:13px;color:var(--ink-soft);line-height:1.25}
.b-items{display:flex;flex-wrap:wrap;gap:6px}

/* para ihop */
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.match .col{display:grid;gap:8px;align-content:start}
.mbtn{padding:8px 10px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);font:800 19px/1.3 var(--font-display);box-shadow:0 3px 0 var(--line)}
.mbtn.sym{background:var(--lilac-soft);border-color:var(--lilac);box-shadow:0 3px 0 var(--lilac)}
.mbtn.sel{outline:3px solid var(--pink);outline-offset:2px}
.mbtn.done{background:var(--good-soft);border-color:var(--good);box-shadow:none;cursor:default}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:440px;width:100%;margin:0 auto}
.mcard{aspect-ratio:1;border:0;padding:0;background:none;perspective:600px}
.mcard .in{position:relative;display:block;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mcard.open .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--line)}
.mcard .f{background:var(--pink-soft);border-color:var(--pink);font-size:28px}
.mcard .b{background:var(--surface-2);color:var(--ink);transform:rotateY(180deg);font:800 clamp(15px,4.4vw,21px)/1.1 var(--font-display);padding:4px;text-align:center}
.mcard.matched .b{background:var(--good-soft);border-color:var(--good)}

/* ordning */
.olist{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:o}
.olist li{counter-increment:o;display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:center;background:var(--good-soft);border:2px solid var(--good);border-radius:14px;padding:8px 12px;font-weight:700;line-height:1.35;animation:pop .3s}
.olist li::before{content:counter(o);width:32px;height:32px;border-radius:50%;background:var(--good);color:var(--surface);display:grid;place-items:center;font:800 18px/1 var(--font-display)}
.opool{display:grid;gap:8px}
.oitem{text-align:left;padding:11px 14px;border-radius:14px;border:2px solid var(--sun);background:var(--sun-soft);color:var(--ink);font-weight:700;line-height:1.35;box-shadow:0 3px 0 var(--sun)}

/* bygg molekyl */
.bench{min-height:124px;border:2px dashed var(--ink-soft);border-radius:20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:12px;background:var(--surface-2)}
.bench-empty{color:var(--ink-soft);font-size:15px}
.bench svg{width:170px;max-width:100%;height:auto;animation:pop .4s}
.atom{width:54px;height:54px;border-radius:50%;display:inline-grid;place-items:center;font:800 22px/1 var(--font-display);border:2px solid var(--ink-soft);color:#2A2342;padding:0;transition:transform .1s}
.a-H{background:var(--atom-h);width:44px;height:44px;font-size:18px}
.a-O{background:var(--atom-o)}
.a-C{background:var(--atom-c);color:#FFFFFF}
.atoms{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:end}
.atom-btn{display:grid;justify-items:center;gap:2px;background:none;border:0;padding:6px 12px;border-radius:14px}
.atom-btn:hover .atom{transform:scale(1.1)}
.atom-name{font-size:14px;font-weight:800}

/* fas-simulator */
.sim{border:2px solid var(--line);border-radius:18px;background:var(--surface-2);overflow:hidden;max-width:460px;width:100%;margin:0 auto}
.sim canvas{display:block;width:100%}
.therm{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;max-width:460px;width:100%;margin:0 auto;font-weight:800}
.therm input{width:100%;height:34px;accent-color:var(--pink)}
.phase-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:460px;width:100%;margin:0 auto}
.ptab{padding:8px 4px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);font-weight:800;font-size:15px}
.ptab.on{background:var(--aqua-soft);border-color:var(--aqua)}
.ptab.seen::after{content:" ✓";color:var(--good)}
.phase-info{max-width:460px;width:100%;margin:0 auto;background:var(--aqua-soft);border-radius:14px;padding:10px 14px;font-weight:700;min-height:86px}
.phase-info strong{display:block;font:800 19px/1.2 var(--font-display)}

/* resultat */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:28px;padding:24px 18px}
.result .cat{width:150px}
.result h1{font-size:clamp(28px,6vw,38px);font-weight:800}
.bigstars{font-size:56px;line-height:1;letter-spacing:6px;color:var(--line)}
.bigstars .on{color:var(--sun);display:inline-block;animation:pop .5s both}
.bigstars .on:nth-child(2){animation-delay:.2s} .bigstars .on:nth-child(3){animation-delay:.4s}
.giftbox{background:var(--lilac-soft);border-radius:16px;padding:10px 16px;font-weight:800}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99}

/* minnesbok */
.note-card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.note-card h2{font-size:23px;color:var(--pink)}
.note-card dl{margin:0;display:grid;gap:10px}
.note-card dt{font:700 18px/1.25 var(--font-display)}
.note-card dd{margin:0;max-width:62ch}
.symtab{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.symtab div{background:var(--lilac-soft);border-radius:12px;padding:6px 10px;display:flex;justify-content:space-between;gap:8px;font-weight:800}
.symtab b{font-family:var(--font-display)}

@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{50%{box-shadow:0 0 0 5px var(--pink-soft)}}
@keyframes floatup{to{transform:translate(var(--dx,0),-90px) scale(1.4);opacity:0}}
@media (max-width:520px){
  body{font-size:16px}
  .hero{gap:14px}
  .coach{grid-template-columns:68px minmax(0,1fr);gap:12px}
  .stage{padding:14px 12px}
  .bubble{padding:11px 14px}
  .brand{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <button type="button" class="pill" id="homeBtn" hidden>‹ Kartan</button>
    <span class="brand" id="brand">Kemikatten</span>
    <span class="pill" title="Stjärnor"><span aria-hidden="true">⭐</span><span id="starCount">0/24</span></span>
    <span class="pill" title="Fiskar till Molly"><span aria-hidden="true">🐟</span><span id="fishCount">0</span></span>
    <button type="button" class="pill" id="soundBtn" aria-label="Ljud av eller på">🔊</button>
  </div>
</header>
<main class="wrap" id="view"></main>

<script>
(function(){
'use strict';
var view=document.getElementById('view');
var TAU=Math.PI*2;
function T(s){return String(s).replace(/₂/g,'<sub>2</sub>');}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=T(html);return e;}
function btn(cls,html,fn){var b=el('button',cls,html);b.type='button';if(fn)b.addEventListener('click',fn);return b;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shake(e){e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');}

/* ---------- sparat läge ---------- */
var KEY='selmas-kemikatt-v1';
var save={stars:{},fish:0,sound:true};
try{var raw=JSON.parse(localStorage.getItem(KEY)||'{}');if(raw&&typeof raw==='object'){save.stars=raw.stars||{};save.fish=raw.fish|0;save.sound=raw.sound!==false;}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}

/* ---------- ljud ---------- */
var ac=null;
function audio(){if(!save.sound)return null;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac;}catch(e){return null;}}
function tone(f,start,dur,type,vol,f2){var a=audio();if(!a)return;try{var o=a.createOscillator(),g=a.createGain(),t=a.currentTime+start;o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.05);}catch(e){}}
var sfx={
  good:function(){tone(660,0,.12,'triangle');tone(990,.1,.22,'triangle');},
  bad:function(){tone(250,0,.24,'sine',.1,170);},
  tap:function(){tone(520,0,.06,'sine',.05);},

/* ---------- en station ---------- */
function play(st){
  clearView();setBar(true);
  var rounds=st.rounds(),i=0,mistakes=0,fish=0,missed={},roundClean=[];
  var head=el('div','st-head','<span class="kick">Station '+st.n+'</span><h1>'+st.title+'</h1>');
  var dots=el('div','dots');rounds.forEach(function(){dots.append(el('i'));});head.append(dots);
  var coach=el('div','coach'),catBox=el('div','cat'),bubble=el('div','bubble');bubble.setAttribute('aria-live','polite');coach.append(catBox,bubble);
  var stage=el('div','stage');
  var fb=el('div','fb'),fbText=el('p'),nextBtn=btn('btn','Nästa',function(){sfx.tap();i++;show();});
  fb.append(fbText,nextBtn);fb.hidden=true;
  view.append(head,coach,stage,fb);
  cleanups.push(function(){roundClean.forEach(function(f){f();});});
  var ctx={
    exam:!!st.exam,stage:stage,
    onClean:function(f){roundClean.push(f);},
    say:function(text,mood){catBox.innerHTML=cat(mood||'normal');bubble.innerHTML='<span>'+T(text)+'</span>';},
    good:function(msg){fish++;save.fish++;persist();updateBar();sfx.good();if(msg!==false)ctx.say(msg||pick(PRAISE),'happy');},
    bad:function(msg){mistakes++;sfx.bad();if(rounds[i].topic)missed[rounds[i].topic]=1;if(msg!==false)ctx.say(msg||pick(OOPS),'oops');},
    done:function(text,oops){
      ctx.say(oops?'Hoppsan! Nu vet du till nästa gång.':pick(PRAISE),oops?'oops':'happy');
      fbText.innerHTML=T(text||'Bra jobbat!');fb.classList.toggle('oops',!!oops);fb.hidden=false;
      nextBtn.textContent=i===rounds.length-1?'Klar!':'Nästa';
      setTimeout(function(){try{fb.scrollIntoView({block:'nearest',behavior:'smooth'});}catch(e){}},60);
    }
  };
  function show(){
    roundClean.forEach(function(f){f();});roundClean=[];
    stage.innerHTML='';fb.hidden=true;
    if(i>=rounds.length)return finish();
    [].forEach.call(dots.children,function(d,k){d.className=k<i?'done':k===i?'now':'';});
    RENDER[rounds[i].type](rounds[i],ctx);
    if(i>0)window.scrollTo(0,0);
  }
  function finish(){
    var stars=mistakes<=1?3:mistakes<=4?2:1;
    var before=totalStars();
    save.stars[st.id]=Math.max(save.stars[st.id]||0,stars);persist();
    var after=totalStars();
    var gift=GIFTS.filter(function(g){return before<g.at&&after>=g.at;})[0];
    clearView();setBar(true);updateBar();
    var res=el('section','result');
    res.append(el('div','cat',cat(stars===3?'love':'happy')));
    res.append(el('h1',null,st.exam?'Du fick '+(rounds.length-mistakes)+' av '+rounds.length+' rätt!':'Station '+st.n+' klar!'));
    res.append(el('div',null,starStr(stars,'bigstars')));
    res.append(el('p',null,stars===3?'Tre stjärnor! Molly spinner av lycka.':stars===2?'Två stjärnor! Riktigt bra jobbat.':'En stjärna! Spela igen så blir det fler.'));
    res.append(el('p',null,'Du fångade '+fish+' '+(fish===1?'fisk':'fiskar')+' till Molly 🐟'));
    if(gift)res.append(el('p','giftbox','Molly fick en present: '+gift.name+'!'));
    var m=Object.keys(missed);
    if(st.exam&&m.length)res.append(el('p',null,'Öva lite mer på: <strong>'+m.join(', ')+'</strong>.'));
    var row=el('div','row');
    var nx=STATIONS[st.n];
    if(nx)row.append(btn('btn','Nästa station',function(){sfx.tap();play(nx);}));
    row.append(btn('btn ghost','Spela igen',function(){sfx.tap();play(st);}),btn('btn ghost','Till kartan',function(){sfx.tap();home();}));
    res.append(row);view.append(res);
    sfx.win();if(stars===3)confetti();
  }
  show();
}

/* ---------- dra och släpp (eller tryck ord, tryck ruta) ---------- */
function dnd(root,accepts,onGood,onBad){
  var sel=null,zones=[].slice.call(root.querySelectorAll('.zone'));
  function unsel(){if(sel){sel.classList.remove('sel');sel=null;}root.classList.remove('has-sel');}
  function zoneAt(x,y){var els=document.elementsFromPoint(x,y);for(var k=0;k<els.length;k++){var z=els[k].closest('.zone');if(z&&root.contains(z))return z;}return null;}
  function attempt(chip,zone){
    unsel();
    if(zone.classList.contains('full'))return;
    if(accepts(chip,zone)){
      chip.classList.add('locked');chip.tabIndex=-1;chip.style.transform='';
      (zone.querySelector('.b-items')||zone).append(chip);
      if(zone.classList.contains('slot')){zone.classList.add('full');zone.removeAttribute('tabindex');}
      onGood(chip,zone);
    }else{shake(chip);onBad(chip,zone);}
  }
  [].forEach.call(root.querySelectorAll('.chip'),function(chip){
    var sx=0,sy=0,pid=null,drag=false,endAt=0;
    chip.addEventListener('pointerdown',function(e){if(chip.classList.contains('locked')||e.button>0)return;pid=e.pointerId;sx=e.clientX;sy=e.clientY;drag=false;try{chip.setPointerCapture(pid);}catch(_){}});
    chip.addEventListener('pointermove',function(e){
      if(e.pointerId!==pid)return;
      var dx=e.clientX-sx,dy=e.clientY-sy;
      if(!drag&&Math.hypot(dx,dy)>8){drag=true;unsel();chip.classList.add('dragging');}
      if(drag){chip.style.transform='translate('+dx+'px,'+dy+'px) scale(1.05)';var z=zoneAt(e.clientX,e.clientY);zones.forEach(function(o){o.classList.toggle('over',o===z&&!o.classList.contains('full'));});}
    });
    function end(e){
      if(e.pointerId!==pid)return;pid=null;
      if(!drag)return;drag=false;endAt=performance.now();
      chip.classList.remove('dragging');chip.style.transform='';
      zones.forEach(function(o){o.classList.remove('over');});
      var z=e.type==='pointerup'?zoneAt(e.clientX,e.clientY):null;
      if(z)attempt(chip,z);
    }
    chip.addEventListener('pointerup',end);chip.addEventListener('pointercancel',end);
    chip.addEventListener('click',function(e){
      if(chip.classList.contains('locked'))return;
      e.stopPropagation();
      if(performance.now()-endAt<400)return;
      if(sel===chip){unsel();return;}
      unsel();sel=chip;chip.classList.add('sel');root.classList.add('has-sel');sfx.tap();
    });
  });
  zones.forEach(function(z){
    function go(){if(sel)attempt(sel,z);}
    z.addEventListener('click',go);
    z.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
  });
}

  sort:function(r,ctx){

  },
  match:function(r,ctx){

    shuffle(r.pairs).forEach(function(p){var b=btn('mbtn',p[0],function(){pickBtn(b,'L');});b.dataset.k=p[0];b.dataset.n=p[0];b.dataset.s=p[1];cl.append(b);});

  },
  memory:function(r,ctx){
    var stage=ctx.stage,left=r.pairs.length,open=[],busy=false;
    ctx.say('Vänd två kort. Hitta ämnet och dess beteckning!');
    stage.append(el('h2','q',r.q));
    var grid=el('div','mem'),cards=[];

    shuffle(cards).forEach(function(c){
      var b=btn('mcard','<span class="in"><span class="f" aria-hidden="true">🐾</span><span class="b"><span>'+c.t+'</span></span></span>',function(){
        if(busy||b.classList.contains('open'))return;

        if(open.length<2)return;

          x.b.classList.add('matched');y.b.classList.add('matched');left--;

          else ctx.good(c.p[0]+' har beteckningen '+c.p[1]+'!');
        }else{busy=true;var t=setTimeout(function(){x.b.classList.remove('open');y.b.classList.remove('open');busy=false;},950);ctx.onClean(function(){clearTimeout(t);});}

  order:function(r,ctx){

    var list=el('ol','olist'),pool=el('div','opool');

  build:function(r,ctx){
    var stage=ctx.stage,have=[],done=false,NAMES={H:'Väte',O:'Syre',C:'Kol'};
    ctx.say(r.say);
    stage.append(el('h2','q',r.q));
    var bench=el('div','bench');bench.setAttribute('aria-live','polite');
    function draw(){
      bench.innerHTML='';
      if(!have.length)bench.append(el('span','bench-empty','Byggbordet är tomt. Tryck på atomerna här under.'));
      have.forEach(function(k,idx){var a=btn('atom a-'+k,k,function(){if(done)return;have.splice(idx,1);sfx.tap();draw();});a.setAttribute('aria-label','Ta bort '+NAMES[k]);bench.append(a);});
    }
    var tray=el('div','atoms');
    Object.keys(NAMES).forEach(function(k){
      tray.append(btn('atom-btn','<span class="atom a-'+k+'">'+k+'</span><span class="atom-name">'+NAMES[k]+'</span>',function(){if(done||have.length>=6)return;have.push(k);sfx.tap();draw();}));
    });
    var row=el('div','row');
    var test=btn('btn small','Testa molekylen',function(){
      if(done)return;
      if(!have.length){ctx.say('Lägg några atomer på byggbordet först!');return;}
      var cnt={};have.forEach(function(k){cnt[k]=(cnt[k]||0)+1;});
      var keys={};Object.keys(cnt).concat(Object.keys(r.target)).forEach(function(k){keys[k]=1;});
      var ok=Object.keys(keys).every(function(k){return (cnt[k]||0)===(r.target[k]||0);});
      if(ok){
        done=true;bench.innerHTML=r.mol;tray.hidden=true;row.hidden=true;hint.hidden=true;
        ctx.good(false);ctx.done(r.e);
      }else{
        var extra=Object.keys(cnt).filter(function(k){return !r.target[k];})[0];
        shake(bench);
        ctx.bad(extra?'Hoppsan! '+NAMES[extra]+' ('+extra+') finns inte med i '+r.formula+'.':'Inte riktigt. Titta på '+r.formula+' igen: en liten tvåa betyder två atomer av sorten precis före.');
      }
    });
    var clear=btn('btn small ghost','Töm bordet',function(){if(done)return;have=[];draw();});
    row.append(test,clear);
    var hint=el('p','note','Tryck på en atom på bordet om du vill ta bort den.');
    stage.append(bench,tray,row,hint);draw();
  },
  explore:function(r,ctx){
    var stage=ctx.stage;
    ctx.say('Dra i reglaget och titta på vattenmolekylerna. Prova alla tre faserna!');
    stage.append(el('h2','q','Värm och kyl vattnet'));
    var box=el('div','sim'),cv=document.createElement('canvas');cv.setAttribute('role','img');cv.setAttribute('aria-label','Vattenmolekyler som rör sig olika i is, vatten och vattenånga');box.append(cv);
    var ctrl=el('div','therm','<label for="temp">❄️ Kallt</label><input type="range" id="temp" min="0" max="2" step="1" value="0"><span>Varmt 🔥</span>');
    var tabs=el('div','phase-tabs'),info=el('div','phase-info');
    stage.append(box,ctrl,tabs,info,el('p','note','Rosa boll = syreatom (O). Vita bollar = väteatomer (H).'));
    var slider=ctrl.querySelector('input'),seen={},mode=0,finished=false;
    var N=18,H=230,W=0,R=14,ps=[],raf=0,col={},frame=0,g=cv.getContext('2d');
    for(var n=0;n<N;n++)ps.push({x:0,y:0,vx:0,vy:0,rot:0,vr:(Math.random()-.5)*.05,ph:Math.random()*TAU,hx:0,hy:0});
    function size(){
      var w=box.clientWidth;if(!w||w===W)return;W=w;
      var d=Math.min(2,window.devicePixelRatio||1);cv.width=W*d;cv.height=H*d;cv.style.height=H+'px';g.setTransform(d,0,0,d,0,0);
      var sp=34,cols=6,x0=W/2-(cols-1)*sp/2,y0=H-28;
      ps.forEach(function(p,k){p.hx=x0+(k%cols)*sp;p.hy=y0-Math.floor(k/cols)*sp;});
    }
    size();ps.forEach(function(p){p.x=p.hx;p.y=p.hy;});
    function colors(){var cs=getComputedStyle(document.documentElement);col={o:cs.getPropertyValue('--atom-o').trim(),h:cs.getPropertyValue('--atom-h').trim(),s:cs.getPropertyValue('--ink-soft').trim()};}
    function set(k){
      mode=k;slider.value=k;seen[k]=1;
      [].forEach.call(tabs.children,function(b,j){b.classList.toggle('on',j===k);b.classList.toggle('seen',!!seen[j]);});
      info.innerHTML='<strong>'+PH[k].name+'</strong>'+PH[k].txt;
      if(k===0)ps.forEach(function(p){p.rot=((p.rot%TAU)+TAU)%TAU;if(p.rot>Math.PI)p.rot-=TAU;});
      else ps.forEach(function(p){if(Math.hypot(p.vx,p.vy)<.05){var a=Math.random()*TAU;p.vx=Math.cos(a)*.3;p.vy=Math.sin(a)*.3;}});
      if(!finished&&seen[0]&&seen[1]&&seen[2]){finished=true;sfx.good();ctx.done('Såg du? Molekylerna ser likadana ut hela tiden, även när vattnet byter fas. Det är bara hur de rör sig som ändras. Du får gärna leka mer med reglaget.');}
    }
    PH.forEach(function(p,k){tabs.append(btn('ptab',p.short,function(){sfx.tap();set(k);}));});
    slider.addEventListener('input',function(){set(+slider.value);});
    function tick(now){
      raf=requestAnimationFrame(tick);size();if(!W)return;
      if(frame++%60===0)colors();
      var t=now/1000;
      if(mode===0){
        ps.forEach(function(p){var tx=p.hx+Math.sin(t*30+p.ph)*1.7,ty=p.hy+Math.cos(t*27+p.ph*2)*1.7;p.x+=(tx-p.x)*.12;p.y+=(ty-p.y)*.12;p.rot+=(0-p.rot)*.1;p.vx=p.vy=0;});
      }else{
        var target=mode===1?.55:2.4,top=mode===1?H*.56:R+6;
        ps.forEach(function(p){
          if(mode===1){p.vx+=(Math.random()-.5)*.08;p.vy+=(Math.random()-.5)*.08;}
          var s=Math.hypot(p.vx,p.vy)||.01,ns=s+(target-s)*.06;p.vx*=ns/s;p.vy*=ns/s;
          p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr*(mode===2?2.5:1);
          if(p.x<R){p.x=R;p.vx=Math.abs(p.vx);}
          if(p.x>W-R){p.x=W-R;p.vx=-Math.abs(p.vx);}
          if(p.y>H-R){p.y=H-R;p.vy=-Math.abs(p.vy);}
          if(p.y<top){if(mode===1){p.y+=(top-p.y)*.06+.5;p.vy=Math.abs(p.vy);}else{p.y=top;p.vy=Math.abs(p.vy);}}
        });
        var minD=mode===1?29:27;
        for(var a=0;a<N;a++)for(var b=a+1;b<N;b++){
          var A=ps[a],B=ps[b],dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||.01;
          if(d<minD){var k=(minD-d)/2/d;A.x-=dx*k;A.y-=dy*k;B.x+=dx*k;B.y+=dy*k;if(mode===2){var tx2=A.vx,ty2=A.vy;A.vx=B.vx;A.vy=B.vy;B.vx=tx2;B.vy=ty2;}}
        }
      }
      g.clearRect(0,0,W,H);
      ps.forEach(function(p){
        g.lineWidth=1.5;g.strokeStyle=col.s;g.fillStyle=col.h;
        [-.9,.9].forEach(function(o){var an=p.rot-Math.PI/2+o;g.beginPath();g.arc(p.x+Math.cos(an)*12,p.y+Math.sin(an)*12,6,0,TAU);g.fill();g.stroke();});
        g.fillStyle=col.o;g.beginPath();g.arc(p.x,p.y,10,0,TAU);g.fill();g.stroke();
      });
    }
    raf=requestAnimationFrame(tick);
    ctx.onClean(function(){cancelAnimationFrame(raf);});
    set(0);
  }
};

 ['Atomen',[

  ['Hur ritar du en atom?','Rita en kärna med protoner och neutroner i mitten. Rita elektroner runt kärnan. Skriv orden atomkärna, proton, neutron och elektron vid rätt delar.']]],
 ['Molekyler och ämnen',[
  ['Vad är materia?','Materia är allt som väger något och tar plats, till exempel vatten, luft och en stol.'],

  ['Vad är en kemisk förening?','Ett ämne där olika sorters atomer sitter ihop. Vatten är en kemisk förening eftersom det består av väte och syre.'],
  ['Hur är en vattenmolekyl uppbyggd?','Den består av två väteatomer och en syreatom. Därför skrivs vatten H₂O.']]],

  ['Hur är molekylerna i is?','De sitter i ett bestämt mönster och vibrerar på sina platser.'],
  ['Hur är molekylerna i flytande vatten?','De är nära varandra men kan glida runt.'],
  ['Hur är molekylerna i vattenånga?','De är långt ifrån varandra och rör sig fritt.'],

 ['Vattnet byter fas',[

/* ---------- konfetti ---------- */
function confetti(){
  try{if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(e){}
  var c=document.createElement('canvas');c.className='confetti';document.body.append(c);
  var g=c.getContext('2d'),W=c.width=window.innerWidth,H=c.height=window.innerHeight;
  var cs=getComputedStyle(document.documentElement),cols=['--pink','--sun','--aqua','--lilac'].map(function(v){return cs.getPropertyValue(v).trim();});
  var ps=[];for(var i=0;i<90;i++)ps.push({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*3,vy:2.5+Math.random()*4,r:4+Math.random()*5,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.3});
  var t0=performance.now();
  (function f(t){
    g.clearRect(0,0,W,H);
    ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.a+=p.va;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.fillRect(-p.r,-p.r/2,p.r*2,p.r);g.restore();});
    if(t-t0<2800)requestAnimationFrame(f);else c.remove();
  })(t0);
}

home();
})();
